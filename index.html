  if(S.billCh&&S.billCh!=='all') bills=bills.filter(b=>billCh(b)===S.billCh);
  const all=bills.length;
  if(sq) bills=bills.filter(b=>(tLabel(b.table)+' '+CH_LABEL[billCh(b)]+' '+(b.ref||'')+' '+b.billNo+' '+(b.posInvoice||'')+' '+(b.waiter||'')+' '+(b.chef||'')+' '+(b.items||[]).map(i=>i.name).join(' ')).toLowerCase().includes(sq));
  const tot=S.dayBills.reduce((a,b)=>a+num(b.total),0);
  const card=b=>`<article class="bcard${billCh(b)==='inhouse'?' inhouse':''}">
      <div class="bhead"><div><span class="chtag ch-${billCh(b)}">${CH_LABEL[billCh(b)]}</span> <strong>${esc(tLabel(b.table))}</strong>${b.ref?` <span class="muted">${esc(b.ref)}</span>`:''} <span class="muted num">· ${esc(timeStr(b.paidAt))}</span></div><span class="num muted">${b.posInvoice?`<b class="posno">POS ${esc(b.posInvoice)}</b> · `:''}${esc(b.billNo||'')}</span></div>
      <div class="rrow head"><span>Item</span><span>Qty</span><span>Rate</span><span>Amount</span></div>
      ${(b.items||[]).map(i=>`<div class="rrow"><span>${esc(i.name)}</span><span class="num">${num(i.qty)}</span><span class="num">${money(i.price)}</span><span class="num">${money(num(i.qty)*num(i.price))}</span></div>`).join('')}
      <div class="bfoot"><span class="muted">Taken by: ${esc(b.waiter||'')}${b.chef?' · Prepared by: <b>'+esc(b.chef)+'</b>':''}</span>${b.confirmedAt?trail({...b,status:'paid'},true):''}<span class="num muted">Subtotal ${money(b.sub)} · Tax ${money(b.tax)}</span>${billCh(b)==='inhouse'?`<span><span class="freetag">No charge</span> <span class="num muted">value ${money(b.value)}</span></span>`:`<b class="num">Total ${money(b.total)}</b>`}</div>
    </article>`;
  const inh=S.dayBills.filter(b=>billCh(b)==='inhouse'); const inhItems={}; inh.forEach(b=>(b.items||[]).forEach(i=>{ inhItems[i.name]=(inhItems[i.name]||0)+num(i.qty); }));
  const inhBox=inh.length?`<div class="inhouse-note"><span class="freetag">In-house</span> <b>${inh.length} order${inh.length===1?'':'s'}</b> · value <b class="num">${money(inh.reduce((x,b)=>x+num(b.value),0))}</b><br>Items used: ${Object.entries(inhItems).map(([n,q])=>`${q}× ${esc(n)}`).join(', ')}<br><span style="font-size:13px">Remember to reduce these in Stock.</span></div>`:'';
  return `<div class="pagehead"><h1>Bills</h1>
      <div class="row" style="align-items:center"><label for="billDay" class="muted" style="font-weight:700">Date</label><input id="billDay" class="inp" type="date" value="${esc(S.billDay)}" max="${dayKey()}" style="width:auto">${isToday?'':'<button type="button" class="btn ghost small" data-act="billToday">Today</button>'}</div></div>
    <div class="pills" style="margin-bottom:12px">${['all','dinein','takeaway','zomato','inhouse'].map(c=>`<button type="button" class="pill" data-act="billCh" data-c="${c}" aria-pressed="${(S.billCh||'all')===c}">${c==='all'?'All':CH_LABEL[c]}</button>`).join('')}</div>
    <div class="row" style="align-items:center;margin-bottom:14px"><div class="msearch" style="flex:1 1 260px"><label for="billSearch" class="sr">Search bills</label><input id="billSearch" class="inp" type="search" placeholder="Search table, bill no., POS invoice, item or barista" value="${esc(S.billQ||'')}" autocomplete="off"></div>
      <span class="muted">${all} bill${all===1?'':'s'} on ${esc(fmtDay(S.billDay,true))}${isOwner()&&all?` · total <b class="num">${money(tot)}</b>`:''}</span></div>
    ${inhBox}
    ${S.dayBillsErr?'<div class="banner">Bills can’t be loaded. The owner needs to update the Firebase rules (Step 2 of the guide).</div>':
      !S.loaded.dayBills?'<div class="empty">Loading bills…</div>':
      !all?`<div class="empty">No paid bills ${isToday?'yet today':'on this date'}. A bill is saved here when “Mark as paid” is tapped.</div>`:
      !bills.length?'<div class="empty">No bills match your search.</div>':`<div class="bgrid">${bills.map(card).join('')}</div>`}`;
}
Object.assign(ACT,{ billToday(){ S.billDay=dayKey(); watchDayBills(); render(true); } });
$main.addEventListener('change', e=>{ if(e.target.id==='billDay' && e.target.value){ S.billDay=e.target.value; e.target.blur(); watchDayBills(); render(true); } });
$main.addEventListener('input', e=>{ if(e.target.id!=='billSearch') return; S.billQ=e.target.value; });
$main.addEventListener('keyup', e=>{ if(e.target.id==='billSearch' && e.key==='Enter'){ e.target.blur(); render(true); } });
$main.addEventListener('search', e=>{ if(e.target.id==='billSearch'){ S.billQ=e.target.value; e.target.blur(); render(true); } });

Object.assign(ACT,{
  newChannel(el){ const ch=el.dataset.ch, base=ch==='inhouse'?300:ch==='zomato'?200:100; let n=1; while(S.orders[base+n]||S.draftNew===base+n&&false) n++; if(n>99) n=99;
    S.table=base+n; S.cat='all'; S.q=''; S.arm=''; S.oseg='menu'; S.view='order'; render(true); window.scrollTo(0,0); },
  billCh(el){ S.billCh=el.dataset.c; render(true); }
});
$main.addEventListener('change', e=>{ if(e.target.id!=='orderRef') return; const t=S.table, o=S.orders[t]; if(!o) return; putOrder(t,{...clone(o),ref:e.target.value.trim().slice(0,60)}); });

S.attMonthKey=monthKey();
start();
})();
</script>
<script>if("serviceWorker" in navigator){ addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }</script>
</body>
</html>
