<style>
/* Look: the BeCafé menu cover — espresso-brown patterned ground, a yellow band across the top, gold rules, cream text. One deliberate dark look. */
:root{
  --bg:#21140D; --bg-2:#2A1911; --surface:#33211A; --surface-2:#3D2920; --fg:#F6EBDD; --muted:#CDB9A3; --line:#5A4030;
  --gold:#C9A24A; --band:#F3CF1F; --band-ink:#3A1F12; --brown:#5A2E1E;
  --accent:#F3CF1F; --accent-hover:#FFDB3D; --accent-fg:#2A160C; --accent-soft:#4A3A12; --accent-ink:#F7DC6A;
  --ok-soft:#1F3A2A; --ok-ink:#9FD8B4; --warn-soft:#4A2C14; --warn-ink:#F5B97A; --info-soft:#1E2C40; --info-ink:#AFC8EE;
  --danger:#F29A8E; --danger-soft:#4A221C; --ink-btn:#F6EBDD; --ink-btn-fg:#2A160C;
  --font:'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --brandfont:'Nunito', 'Manrope', ui-rounded, system-ui, sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;
  background-image:radial-gradient(circle at 20% 30%, rgba(201,162,74,.07) 0 2px, transparent 3px),radial-gradient(circle at 70% 70%, rgba(201,162,74,.05) 0 2px, transparent 3px),radial-gradient(ellipse at 50% 0%, #3A2216 0%, transparent 60%);
  background-size:28px 28px,28px 28px,100% 100%;background-attachment:fixed}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--band);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-0.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink);border-bottom:3px solid var(--gold);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{display:inline-flex;align-items:center;gap:8px;background:var(--brown);color:var(--band);border:3px solid var(--band-ink);box-shadow:0 0 0 2px var(--band),0 0 0 4px var(--gold);
  border-radius:999px;padding:4px 18px;font-family:var(--brandfont);font-weight:900;font-size:22px;letter-spacing:.01em;margin-right:6px}
.brand svg{width:20px;height:20px}
.nav{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 auto}
.nav button{height:44px;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:800;color:var(--band-ink);cursor:pointer}
.nav button:hover{background:rgba(58,31,18,.12)}
.nav button[aria-current="page"]{background:var(--band-ink);color:var(--band)}
.who{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;flex-wrap:wrap}
.who select{height:44px;border-radius:10px;border:2px solid var(--band-ink);background:#FFF6CC;color:var(--band-ink);font-weight:800;padding:0 10px;max-width:200px}
.role{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--band-ink);color:var(--band);padding:4px 8px;border-radius:6px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1440px;margin:0 auto}

.btn{height:52px;padding:0 20px;border-radius:12px;border:1px solid transparent;font-size:16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover)}
.btn.dark{background:var(--ink-btn);color:var(--ink-btn-fg)}
.btn.ghost{background:var(--surface-2);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--gold)}
.btn.small{height:44px;padding:0 14px;font-size:15px}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:700;height:44px;padding:0 10px;border-radius:10px;cursor:pointer}
.linkbtn:hover{background:var(--surface-2);color:var(--fg)}
.linkbtn.danger{color:var(--danger)}

.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;width:fit-content}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.b-free{background:var(--surface-2);color:var(--muted)}
.b-open{background:var(--warn-soft);color:var(--warn-ink)}
.b-confirmed{background:var(--ok-soft);color:var(--ok-ink)}
.b-billed{background:var(--info-soft);color:var(--info-ink)}
.tag{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--warn-soft);color:var(--warn-ink)}
.tag.red{background:var(--danger-soft);color:var(--danger)}

.pagehead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px dashed var(--gold)}
.pagehead h1{font-size:26px;font-family:var(--brandfont);font-weight:900;color:var(--band)}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.muted{color:var(--muted)}

.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{text-align:left;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:150px}
.tcard:hover{border-color:var(--gold)}
.tcard .tname{font-size:24px;font-weight:800}
.tcard .titems{font-size:14px;color:var(--fg);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard .tinfo{margin-top:auto;font-size:14px;color:var(--muted)}
.tcard.st-open{border-color:var(--warn-ink)}
.tcard.st-confirmed{border-color:var(--ok-ink)}
.tcard.st-billed{border-color:var(--info-ink)}

.orderwrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.menu{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:14px}
.panel{flex:1 1 340px;min-width:0;max-width:100%;background:var(--surface);border:1px solid var(--gold);border-radius:16px;display:flex;flex-direction:column;position:sticky;top:84px}
.ordhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px}
.ordhead h1{font-size:26px;font-family:var(--brandfont);font-weight:900;color:var(--band)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.notice{padding:12px 16px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:15px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:140px}
.mcard.on{border-color:var(--band);box-shadow:inset 0 0 0 1px var(--band)}
.mcard.locked{opacity:.55}
.mcard .mname{font-weight:700;font-size:17px}
.mcard .mnote{font-size:14px;color:var(--muted)}
.mcard .mfoot{margin-top:auto;padding-top:10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.price{font-weight:800;color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:4px}
.sbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:600;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.sbtn.add{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.sbtn:disabled{opacity:.35;cursor:not-allowed}
.qty{min-width:28px;text-align:center;font-weight:800;font-size:17px}

.panel .phead{padding:18px 20px 6px;display:flex;justify-content:space-between;align-items:baseline}
.panel .phead h2{font-size:20px}
.lines{padding:0 20px;overflow:auto;max-height:46vh}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .lname{font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.line .lsub{font-size:13px;color:var(--muted)}
.line .ltot{min-width:72px;text-align:right;font-weight:800}
.line.removed{color:var(--muted)}
.line.removed .lname span:first-child{text-decoration:line-through}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}
.sums{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sumrow{display:flex;justify-content:space-between;color:var(--muted);font-size:15px}
.sumrow.total{color:var(--fg);font-size:20px;font-weight:800;padding-top:4px}
.actions{display:flex;gap:10px;padding-top:10px;flex-wrap:wrap}
.actions .grow{flex:1 1 140px}

/* the bill is a paper receipt on the dark counter */
.billwrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
.receipt{flex:0 1 520px;min-width:0;background:#FFF9EE;color:#2A160C;border-radius:6px;border-top:10px solid var(--band);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.receipt .muted{color:#6B5242}
.receipt .rhead{padding:20px 24px 14px;border-bottom:1px dashed #B79A6E;text-align:center;display:flex;flex-direction:column;gap:4px}
.receipt .rname{font-family:var(--brandfont);font-size:28px;font-weight:900;color:var(--brown)}
.rmeta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;margin-top:10px;text-align:left;font-size:14px}
.rmeta span:nth-child(even){text-align:right}
.rtable{padding:6px 24px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 40px 72px 84px;gap:8px;padding:8px 0;border-bottom:1px solid #EADFCB;font-size:15px}
.rrow.head{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#6B5242}
.rrow span:nth-child(2){text-align:center}.rrow span:nth-child(3),.rrow span:nth-child(4){text-align:right}
.receipt .sums{border-top:1px dashed #B79A6E}
.receipt .sumrow{color:#6B5242}.receipt .sumrow.total{color:#2A160C}
.side{flex:0 1 280px;display:flex;flex-direction:column;gap:10px;min-width:0}

.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat .k{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

.salesgrid{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.salesgrid > .itemwise{flex:1 1 300px;min-width:0}
.salesgrid > .billlist{flex:999 1 520px;min-width:0}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%}
.billlist table{min-width:560px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.r,th.r{text-align:right}
td .det{font-size:14px;color:var(--muted);margin-top:2px}
h2.sec{font-size:18px;margin:0 0 10px;color:var(--band)}

.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.box h2{font-size:19px;color:var(--band)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:14px;font-weight:700}
.field input,.inp{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);padding:0 12px;font-size:16px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding-left:12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:600}
.chip button{width:40px;height:40px;border:0;background:none;border-radius:999px;cursor:pointer;color:var(--muted);font-size:18px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow .mt{font-weight:700}
.mrow .ms{font-size:13px;color:var(--muted)}
.mrow .mb{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.cathead{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);padding-top:10px}

.signin{display:flex;justify-content:center;padding-top:5vh}
.signin .box{width:100%;max-width:560px;padding:28px;border-color:var(--gold)}
.signin h1{font-size:30px;font-family:var(--brandfont);font-weight:900;color:var(--band)}
.namebtn{height:60px;padding:0 24px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;font-size:18px;cursor:pointer}
.namebtn:hover{border-color:var(--band)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row input{flex:1 1 200px}
textarea{width:100%;min-height:180px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:15px}
.err{color:var(--danger);font-weight:600;font-size:15px}

.banner{padding:14px 16px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-weight:600;margin-bottom:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--band);color:var(--band-ink);padding:12px 20px;border-radius:12px;font-weight:800;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
@media (max-width: 700px){ .panel{position:static} .lines{max-height:none} .brand{font-size:19px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
/* Theme v3: brown top bar, light yellow ground, brown actions. */
:root{
  --bg:#FBF3D1; --bg-2:#FFFAE6; --surface:#FFFDF5; --surface-2:#F7EEC8; --fg:#2A160C; --muted:#665244; --line:#E8DCA8;
  --gold:#B8963E; --band:#3A1F12; --band-ink:#F6EBC8; --brown:#5A2E1E; --leaf:#F5E39A;
  --accent:#5A2E1E; --accent-hover:#46220F; --accent-fg:#FBF6E4; --accent-soft:#F5E39A; --accent-ink:#5A2E1E;
  --ok-soft:#D9EDD5; --ok-ink:#2C6637; --warn-soft:#FAE3CC; --warn-ink:#8A4A0E; --info-soft:#DCE6F4; --info-ink:#244F88;
  --danger:#A3302A; --danger-soft:#F7DDD8; --ink-btn:#2A160C; --ink-btn-fg:#FBF6E4;
  color-scheme:light;
}
body{background-image:radial-gradient(circle at 20% 30%, rgba(150,110,20,.08) 0 2px, transparent 3px),radial-gradient(circle at 70% 70%, rgba(150,110,20,.06) 0 2px, transparent 3px);background-size:28px 28px,28px 28px}
:focus-visible{outline-color:var(--brown)}
.topbar{background:var(--band);color:var(--band-ink);border-bottom:3px solid var(--gold)}
.brand{background:var(--leaf);color:var(--brown);border-color:var(--brown);box-shadow:0 0 0 2px var(--leaf),0 0 0 4px var(--gold)}
.nav button{color:var(--band-ink)}
.nav button:hover{background:rgba(246,235,200,.12)}
.nav button[aria-current="page"]{background:var(--leaf);color:var(--brown)}
.who select{background:var(--bg-2);color:var(--brown);border-color:var(--gold)}
.role{background:var(--leaf);color:var(--brown)}
.pagehead h1,.ordhead h1,.signin h1,.box h2,h2.sec,.stat .v,.price,.kcard li b{color:var(--brown)}
.pill[aria-pressed="true"]{background:var(--brown);color:var(--accent-fg);border-color:var(--brown)}
.mcard.on{border-color:var(--brown);box-shadow:inset 0 0 0 1px var(--brown)}
.tcard:hover,.btn.ghost:hover:not(:disabled),.namebtn:hover{border-color:var(--brown)}
.btn.ghost{background:var(--surface)}
.notice{background:var(--leaf);color:var(--brown)}
.receipt{background:#FFFDF5;border-top-color:var(--brown);box-shadow:0 8px 24px rgba(58,31,18,.15);border:1px solid var(--line);border-top:10px solid var(--brown)}
.toast{background:var(--brown);color:var(--accent-fg)}
.signin .box,.panel{border-color:var(--gold)}
.rangebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.stat .delta{display:block;margin-top:6px;font-size:13px;font-weight:700}
.delta.up{color:var(--ok-ink)}.delta.down{color:var(--danger)}
.insight{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px;align-items:start}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:12px;font-family:var(--font)}
.chart .bar{fill:var(--brown)}.chart .bar.hi{fill:var(--gold)}
.chart rect[data-tip]:hover{fill:rgba(90,46,30,.06)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px;padding:2px 0}
.hname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htrack{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hfill{display:block;height:100%;background:var(--brown);border-radius:0 4px 4px 0}
.hval{font-weight:700;text-align:right;white-space:nowrap}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink-btn);color:var(--ink-btn-fg);padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;max-width:260px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.srow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow.low .mt{color:var(--danger)}
.srow .mt{font-weight:700;font-size:16px}.srow .ms{font-size:13px;color:var(--muted)}
.sctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sq{width:96px!important;text-align:center;font-weight:800}
.unit{min-width:44px;color:var(--muted);font-weight:700}
table.att{min-width:auto}
table.att th,table.att td{padding:6px 4px;text-align:center}
table.att .nm{text-align:left;padding-left:12px;white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}
table.att th.dc{font-size:12px;min-width:30px}
table.att th.dc span{font-weight:600;color:var(--muted)}
table.att th.sun{background:var(--surface-2)}
table.att td.dc button{width:30px;height:34px;border:0;border-radius:6px;background:transparent;cursor:pointer;font-weight:800}
table.att td.pr button{background:var(--ok-soft);color:var(--ok-ink)}
table.att td.lv button{background:var(--info-soft);color:var(--info-ink)}
table.att td.ab button{color:var(--muted)}
table.att td.dc button:disabled{cursor:default}
table.att td.r,table.att th.r{padding:6px 10px;white-space:nowrap}
table.att tbody th.nm{text-transform:none;letter-spacing:0;font-size:15px;color:var(--fg);font-weight:700}
table.att .tot{border-left:1px solid var(--line)}
table.att td.r:nth-child(4),table.att th.r:nth-child(4){border-right:2px solid var(--line)}
.msearch{max-width:420px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mcard .mfoot+.mfoot{margin-top:0;padding-top:6px}
.mcard .sz{font-weight:800;font-size:13px;background:var(--surface-2);border-radius:6px;padding:2px 7px;margin-right:auto}
.mcard .sz+.price{margin-right:8px}
.mcard .mfoot{flex-wrap:nowrap}
.mcard .stepper .sbtn{width:40px;height:44px}
.signin .logo{display:block;width:100%;max-width:300px;margin:0 auto 6px;border-radius:18px;box-shadow:0 6px 18px rgba(58,31,18,.25)}
.signin h1{text-align:center}
.outlet{text-align:center;margin:-2px 0 4px;font-family:var(--brandfont);font-weight:900;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--brown)}
.outlet::before,.outlet::after{content:"";flex:0 1 32px;min-width:12px;height:2px;background:var(--gold)}
.outlet{display:flex!important;align-items:center;justify-content:center;gap:10px;white-space:nowrap;font-size:clamp(15px,4.6vw,20px)!important;letter-spacing:.04em!important;margin:2px 0 6px!important}
.receipt .routlet{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#5A2E1E}
.outbtn{height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--band-ink);background:transparent;color:var(--band-ink);font-weight:800;cursor:pointer;white-space:nowrap}
.whoami{font-size:12px;opacity:.85;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outbtn:hover{background:rgba(246,235,200,.15)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.bcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brown);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bcard .bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.bcard .bhead strong{font-size:18px}
.bcard .rrow{grid-template-columns:minmax(0,1fr) 36px 72px 80px;border-bottom:1px solid var(--line);font-size:14px;padding:6px 0}
.bcard .rrow.head{color:var(--muted)}
.bcard .bfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;padding-top:8px;font-size:14px}
.bcard .bfoot b{font-size:16px;width:100%;text-align:right}
.tstrip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tchip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;min-width:120px}
.tchip strong{font-size:15px}
.chwrap{margin-top:26px}
.chhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.chhead .sec{margin:0}
.chtag{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--brown);vertical-align:middle}
.chtag.ch-zomato{background:#FBE0E0;color:#A12828}.chtag.ch-takeaway{background:#DCE6F4;color:#244F88}
.tchip.ch-zomato{border-color:#E8A3A3}.tchip.ch-takeaway{border-color:#A9C0E3}
.chtag.ch-inhouse{background:#EADCF5;color:#5B2E86}.tchip.ch-inhouse{border-color:#C7A6E3}
.tcard.ch-inhouse{border:2px dashed #A77BD0;background:#FAF5FE}
.tcard.ch-zomato{border:2px solid #E8A3A3;background:#FFF6F6}.tcard.ch-takeaway{border:2px solid #A9C0E3;background:#F5F8FD}
.tcard .chtag{align-self:flex-start}
.newrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.newrow .btn.ch-takeaway{background:#244F88;border-color:#244F88;color:#fff}.newrow .btn.ch-zomato{background:#A12828;border-color:#A12828;color:#fff}.newrow .btn.ch-inhouse{background:#5B2E86;border-color:#5B2E86;color:#fff}
.extrabox{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin:0 0 12px}
.xtable{width:100%;border-collapse:collapse;margin:8px 0}
.xtable td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.xtable td.pr{width:120px}
.xtable input{width:100%}
.xtable .grp td{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#7a6a5a);padding-top:12px;border-bottom:0}
.xgroup{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#7a6a5a);margin:10px 0 6px}
.xbtn{min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#FFFDF6;color:var(--brown);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-align:left}
.xbtn b{margin-left:6px}
.xbtn.noprice{border-style:dashed;color:#8a6a4a}
.extrabox summary{cursor:pointer;font-weight:700;color:var(--brown);min-height:32px;display:flex;align-items:center}
.extrabox form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:8px}
.extrabox .field{margin:0}
.takenrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 14px}
.takenrow.need{border:2px solid #E08A3A;background:#FFF4E8}
.takenrow .cheflbl{margin:0;font-size:15px}
.cheflbl{font-size:13px;font-weight:700;color:var(--muted,#7a6a5a);margin-top:4px}
.cheflist{display:flex;flex-wrap:wrap;gap:6px}
.chefbtn{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--brown);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.chefbtn[aria-pressed=true]{background:var(--brown);border-color:var(--brown);color:#fff}
.chefname{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:800;color:var(--brown);background:#F3E7D3;border-radius:10px;padding:8px 10px;margin-top:4px}
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:14px;color:var(--muted,#6b5a4c);margin:8px 0}
.trail.small{font-size:13px;margin:4px 0}
.trail .tstep{background:#F6EEDF;border-radius:999px;padding:3px 9px;white-space:nowrap}
.trail .tstep b{color:#3B2416}
.trail .tstep.wait{background:#FCE8CF;color:#8A4B0F}
.trail .tarrow{opacity:.5}
.trail .tdur{margin-left:4px;font-weight:600;color:#1F6B35}
@media print{.trail .tstep{background:none;padding:0}}
.tserve{font-size:13px;font-weight:700;border-radius:999px;padding:3px 9px;width:fit-content;background:#FCE8CF;color:#8A4B0F}
.tserve.done{background:#0E7C86;color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.chefname.done{background:#E2F1E4;color:#1F6B35}
.chefname.none{color:#A35A1A;background:#FFF1E2;font-size:15px;font-weight:700}
.kcard.ch-zomato{border-top:5px solid #C94A4A}.kcard.ch-takeaway{border-top:5px solid #3A6BB0}.kcard.ch-inhouse{border-top:5px dashed #8A55BC;background:#FBF7FE}.kcard.ch-dinein{border-top:5px solid #8B5A2B}
.inhouse-note{background:#F3EAFB;border:1px solid #D9C2EE;color:#4B2470;border-radius:12px;padding:10px 14px;font-size:15px;margin:0 0 12px}
.bcard.inhouse{border:2px dashed #A77BD0;background:#FAF5FE}
.freetag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:#5B2E86;color:#fff;border-radius:6px;padding:2px 8px}

/* Daily purchases */
.pwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}

.pform h2{font-size:20px}
.pform .takenrow{margin:0}

.plow{background:var(--bg-2);border:1px dashed #E08A3A;border-radius:12px;padding:8px 12px}
.plow summary{cursor:pointer;font-weight:800;color:#8A4B0F;min-height:32px;display:flex;align-items:center}
.plowlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:220px;overflow:auto}
.pcard .khead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pcard .khead strong{min-width:0}
.pcard .khead .muted{white-space:nowrap;font-size:13px}
.paygrp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paybtn{min-height:64px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:8px 12px;text-align:left}
.paybtn small{font-weight:600;font-size:12px;color:var(--muted)}
.paybtn[aria-pressed=true][data-m=cash]{border-color:#2C6637;background:#E2F1E4}
.paybtn[aria-pressed=true][data-m=pending]{border-color:#C0661C;background:#FCE8CF}
.pcam{cursor:pointer}
.pthumb{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ptotal{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.ptotal.big{font-size:20px;border-top:1px dashed var(--line);padding-top:10px}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}

.cbhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px 0}
.cbt{font-size:18px;font-weight:900;color:var(--brown)}
.cbh{font-size:13px;font-weight:700;color:var(--muted)}
.catrowwrap{display:flex;align-items:center;gap:6px}
.carr{flex:0 0 auto;width:40px;height:48px;border-radius:12px;border:2px solid var(--brown);background:var(--surface);color:var(--brown);font-size:24px;font-weight:900;cursor:pointer;line-height:1}
.catrow{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 0;mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
.catrow::-webkit-scrollbar{display:none}
body[data-view=order] .orderwrap > .menu,body[data-view=order] .orderwrap > .panel{min-width:0!important;max-width:100%;align-self:stretch}
@media (max-width:900px){ body[data-view=order] .orderwrap > *{width:100%!important} }
.catpick{min-width:0;max-width:100%}
@media (max-width:900px){ body[data-view=order] .menu .items{min-height:75vh;align-content:start} }
.catrow .catpill{flex:0 0 auto;white-space:nowrap}
.catpill{min-height:48px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--bg-2);font-weight:800;font-size:16px;cursor:pointer;color:var(--fg)}
.catpill[aria-pressed=true]{background:var(--brown);color:var(--accent-fg);border-color:var(--brown)}
.catselwrap{position:relative}
.catsel{height:58px!important;font-size:18px!important;font-weight:800;border:2px solid var(--brown)!important;background:#FFF6DA!important;color:var(--fg);appearance:none;-webkit-appearance:none;padding-right:48px!important}
.catselwrap::after{content:"▼";position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--brown);font-size:16px}
.cathead{font-size:20px;color:var(--brown);margin:4px 0 2px}
.catnav{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.catnav .btn{flex:0 1 auto;max-width:48%;white-space:normal;line-height:1.15;height:auto;min-height:52px;padding:6px 14px}
.secwrap{display:none!important}
.gomenu{display:none;margin-top:12px;width:100%;min-height:54px;border-radius:14px;border:2px dashed var(--brown);background:var(--surface);color:var(--brown);font-weight:800;font-size:17px;align-items:center;justify-content:center;cursor:pointer}
@media (max-width:900px){ body[data-view=order] .toast{top:calc(64px + env(safe-area-inset-top,0px))!important;bottom:auto!important} }
@media (max-width:900px){ body[data-view=order] .gomenu{display:flex} body[data-view=order] .orderwrap.seg-menu ~ .gomenu{display:none} }

/* menu animations */
@keyframes itemIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.items.anim-in>.mcard{animation:itemIn .34s cubic-bezier(.2,.8,.2,1) both}
.items.anim-in>.mcard:nth-child(2){animation-delay:.04s}.items.anim-in>.mcard:nth-child(3){animation-delay:.08s}.items.anim-in>.mcard:nth-child(4){animation-delay:.12s}
.items.anim-in>.mcard:nth-child(5){animation-delay:.16s}.items.anim-in>.mcard:nth-child(6){animation-delay:.2s}.items.anim-in>.mcard:nth-child(n+7){animation-delay:.24s}
@keyframes cardPop{0%{transform:scale(1)}35%{transform:scale(1.035);box-shadow:0 0 0 6px rgba(243,207,31,.75),inset 0 0 0 1px var(--brown)}100%{transform:scale(1);box-shadow:inset 0 0 0 1px var(--brown)}}
.mcard.pop{animation:cardPop .5s ease}
@keyframes numPop{0%{transform:scale(1)}45%{transform:scale(1.6)}100%{transform:scale(1)}}
.mcard.pop .qty{display:inline-block;animation:numPop .4s ease}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.08)}70%{transform:scale(.97)}}
.oseg button.bump{animation:bump .45s ease}
@keyframes pillIn{0%{transform:scale(.88)}60%{transform:scale(1.08)}100%{transform:scale(1.04)}}
.catpill[aria-pressed=true]{transform:scale(1.04);box-shadow:0 3px 10px rgba(58,31,18,.25)}
.catpill.just{animation:pillIn .35s ease}
@media (prefers-reduced-motion:reduce){ .items.anim-in>.mcard,.mcard.pop,.mcard.pop .qty,.oseg button.bump,.catpill.just{animation:none!important} }
</style>
</head>

function clone(o){ return JSON.parse(JSON.stringify(o||{})); }
function totals(items){
  let sub=0,count=0;
  for(const k in (items||{})){ sub+=num(items[k].price)*num(items[k].qty); count+=num(items[k].qty); }
  const tax=sub*num(S.settings.taxPercent)/100;
  return {sub,tax,total:sub+tax,count};
}
function itemText(items){ return (Array.isArray(items)?items:Object.values(items||{})).map(i=>num(i.qty)+'× '+i.name).join(', '); }
function statusOf(t){ const o=S.orders[t]; return o ? (o.status||'open') : 'free'; }
const STATUS = {free:'Free', open:'Taking order', confirmed:'Order confirmed', billed:'Bill ready'};

let toastTimer;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.hidden=true;},2600); }
function fail(e){ toast(e && e.code==='permission-denied' ? 'Only the owner can do that.' : 'Couldn’t save. Check the internet connection and try again.'); }

/* ---------- rendering ---------- */
function typing(){ const a=document.activeElement; return a && $main.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); }
function render(force){
  if(!force && typing()){ S.pending=true; return; }
  S.pending=false;
  document.getElementById('brand').textContent = S.settings.cafeName || 'BeCafé';
  renderNav();
  if(S.phase==='setup'){ $main.innerHTML=viewSetup(); return; }
  if(S.phase==='login'){ $main.innerHTML=viewLogin(); return; }
  if(S.phase==='loading'){ $main.innerHTML='<div class="empty">Connecting…</div>'; return; }
  let html='';
  if(S.rulesWarn) html += '<div class="banner">You are signed in as the owner ('+esc(S.email)+'), but the Firebase rules don’t recognise this email yet, so menu, stock and sales can’t be saved or loaded. In Firebase › Firestore Database › Rules, the 5th line must say <b>request.auth.token.email == \'fatemaakhtarcs@gmail.com\'</b>. Click Publish, then reload this page.</div>';
  if(S.offline) html += '<div class="banner">Can’t reach the cafe’s order database. Check the tablet’s internet connection. Changes will sync when it’s back.</div>';
  if(!S.barista) html += viewSignIn();
  else if(S.view==='order') html += viewOrder();
  else if(S.view==='bill') html += viewBill();
  else if(isOwner() && ['tables','order','bill'].includes(S.view)) html += viewToday();
  else if(S.view==='kitchen') html += viewKitchen();
  else if(S.view==='bills') html += viewBills();
  else if(S.view==='sales' && isOwner()) html += viewSales();
  else if(S.view==='stock') html += viewStock();
  else if(S.view==='purchases') html += viewPurchases();
  else if(S.view==='attendance') html += viewAttendance();
  else if(S.view==='settings' && isOwner()) html += viewSettings();
  else html += viewTables();
  const sk=S.view+':'+S.table, sv=[];
  if(S._sk===sk) ['.menu','.lines','.pills','.takenrow .cheflist','.nav','.catrow'].forEach(k=>{ const e=document.querySelector(k); if(e) sv.push([k,e.scrollTop,e.scrollLeft]); });
  S._sk=sk;
  document.body.dataset.view = (S.barista && S.view==='order') ? 'order' : (S.view||'');
  $main.innerHTML = html;
  sv.forEach(([k,t,l])=>{ const e=document.querySelector(k); if(e){ e.scrollTop=t; e.scrollLeft=l; } });
}

const $tip=document.getElementById('tip');
function showTip(el,x,y){ $tip.textContent=el.getAttribute('data-tip'); $tip.hidden=false; const w=$tip.offsetWidth; $tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+'px'; $tip.style.top=Math.max(8,y-$tip.offsetHeight-12)+'px'; }
$main.addEventListener('pointermove',e=>{ const el=e.target.closest('[data-tip]'); if(el) showTip(el,e.clientX,e.clientY); else $tip.hidden=true; });
$main.addEventListener('pointerleave',()=>{ $tip.hidden=true; });
$main.addEventListener('change', e=>{ if(e.target.id==='showPass'){ const p=document.getElementById('lPass'); if(p) p.type=e.target.checked?'text':'password'; } });
$main.addEventListener('input', e=>{ if(e.target.id!=='menuSearch') return; S.q=e.target.value; const q=S.q.trim().toLowerCase();
  $main.querySelectorAll('.mcard[data-s]').forEach(c=>{ c.hidden = !!q && !c.dataset.s.includes(q); }); });

/* forms: handle submit buttons directly, so they work even where the browser blocks real form submission */
document.addEventListener('click', e=>{ const btn=e.target.closest('button[type=submit]'); if(!btn) return; const form=btn.closest('form'); if(!form) return;
  e.preventDefault(); form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); }, true);
$main.addEventListener('focusout', ()=>{ setTimeout(()=>{ if(S.pending && !typing()) render(); },0); });

function renderNav(){
  const nav=document.getElementById('nav'), who=document.getElementById('who');
  const outBtn = `<span class="whoami" title="Signed in">${esc(S.email||'')}</span><button type="button" class="outbtn" data-act="signOutTop">${S.arm==='signout'?'Tap again to sign out':'Sign out'}</button>`;
  if(S.phase!=='app'){ nav.innerHTML=''; who.innerHTML=''; return; }
  if(!S.barista){ nav.innerHTML=''; who.innerHTML=outBtn; return; }
  const cur = isOwner()&&['tables','order','bill'].includes(S.view) ? 'tables' : (S.view==='order'||S.view==='bill') ? 'tables' : S.view;
  const kcount = Object.values(S.orders).filter(waitingKitchen).length;
  const lowN=S.stock.filter(isLow).length;
  const due=isOwner()&&S.purPending?S.purPending.length:0;
  const items=[...(isOwner()?[['tables','Today','Today','🏠',0,'']]:[['tables','Orders','Orders','📝',0,'']]),['kitchen','Kitchen','Kitchen','🍳',kcount,''],['bills','Bills','Bills','🧾',0,''],['stock','Stock','Stock','📦',lowN,' low'],['purchases','Purchases','Buying','🛒',due,' due'],['attendance','Attendance','Staff','🕘',0,'']];
  if(isOwner()) items.push(['sales','Analytics','Reports','📊',0,'']);
  if(isOwner()&&innerWidth>1100) items.push(['settings','Settings','Setup','⚙️',0,'']);
  nav.innerHTML = items.map(([k,l,sh,ic,n,suf])=>`<button type="button" data-act="nav" data-v="${k}" ${cur===k?'aria-current="page"':''} aria-label="${esc(l)}${n?', '+n+suf:''}"><span class="ni" aria-hidden="true">${ic}</span><span class="nl">${esc(l)}${n?' ('+n+suf+')':''}</span><span class="ns" aria-hidden="true">${esc(sh)}</span>${n?`<span class="nb" aria-hidden="true">${n>99?'99+':n}</span>`:''}</button>`).join('');
  const staff=(S.settings.staff||[]).slice(); if(!staff.includes(S.barista)) staff.unshift(S.barista);
  if(isOwner()){ who.innerHTML=`<span class="role">Owner</span>${outBtn}`; return; }
  who.innerHTML=`<span class="role">Barista</span>${outBtn}`;
}
document.getElementById('who').addEventListener('change', e=>{
  if(e.target.id!=='baristaSel') return;
  const v=e.target.value;
  if(v==='__new'){ S.barista=''; lsSet('becafe.barista',null); render(true); return; }
  S.barista=v; lsSet('becafe.barista',v); toast('Now serving: '+v); render(true);
});

function viewSignIn(){
  const staff = S.settings.staff||[];
  return `<section class="signin"><div class="box">
    ${LOGOF()}
    <h1>Who’s on the counter?</h1>
    <p class="muted">Tap your name to start. Other baristas can switch any time from the name at the top.</p>
    ${staff.length?`<div class="chips">${staff.map(n=>`<button type="button" class="namebtn" data-act="pickBarista" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>`
      :`<p class="muted">${isOwner()?'Add your baristas in Settings so their names appear here.':'The owner hasn’t added barista names yet.'}</p>`}
    <form id="fSignin" class="field">
      <label for="newName">${staff.length?'Not listed? Enter your name':'Your name'}</label>
      <div class="row"><input id="newName" class="inp" autocomplete="off" placeholder="e.g. Chintu" maxlength="40"><button class="btn primary" type="submit">Start</button></div>
    </form>
  </div></section>`;
}


/* ---------- order channels: dine-in tables, takeaway (101+), Zomato (201+) ---------- */
function chOf(t){ t=Number(t); return t>=300?'inhouse':t>=200?'zomato':t>=100?'takeaway':'dinein'; }
const CH_LABEL={dinein:'Dine-in',takeaway:'Takeaway',zomato:'Zomato',inhouse:'In-house'};
function tLabel(t){ t=Number(t); return t>=300?'In-house #'+(t-300):t>=200?'Zomato #'+(t-200):t>=100?'Takeaway #'+(t-100):'Table '+t; }
function billCh(b){ return b.channel||chOf(b.table); }
function viewTables(){
  const n = Math.max(1, Math.min(60, Math.round(num(S.settings.tables)||12)));
  const ids = new Set(); for(let i=1;i<=n;i++) ids.add(i);
  Object.keys(S.orders).forEach(k=>{ if(Number(k)<100) ids.add(Number(k)); });
  const list=[...ids].sort((a,b)=>a-b);
  const chList=ch=>Object.keys(S.orders).map(Number).filter(t=>chOf(t)===ch).sort((a,b)=>a-b);
  const busy=list.filter(t=>statusOf(t)!=='free').length;
  const cardFor = t=>{
    const st=statusOf(t), o=S.orders[t], tt=o?totals(o.items):null;
    const items = st==='free' ? '' : `<span class="titems">${esc(itemText(o.items))}</span>`;
    const info = st==='free' ? 'Tap to take an order' : `<span class="num">${money(tt.total)}</span>${o.waiter?' · '+esc(o.waiter):''}`;
    return `<button type="button" class="tcard st-${st} ch-${chOf(t)}" data-act="openTable" data-t="${t}" aria-label="${tLabel(t)}, ${STATUS[st]}">
      ${chOf(t)!=='dinein'?`<span class="chtag ch-${chOf(t)}">${CH_LABEL[chOf(t)]}${chOf(t)==='inhouse'?' · no charge':''}</span>`:''}<span class="tname">${tLabel(t)}</span>${o&&o.ref?`<span class="muted" style="font-size:13px">${esc(o.ref)}</span>`:''}<span class="badge b-${st}">${STATUS[st]}</span>${serveTag(o,st)}${items}<span class="tinfo">${info}</span></button>`;
  };
  const dineCards=list.map(cardFor).join('');
  const chSection=(ch,icon)=>{ const l=chList(ch); return `<div class="chhead"><h2 class="sec">${CH_LABEL[ch]} orders</h2><button type="button" class="btn primary small" data-act="newChannel" data-ch="${ch}">+ New ${CH_LABEL[ch]} order</button></div>
    ${l.length?`<div class="tables">${l.map(cardFor).join('')}</div>`:`<p class="muted" style="margin:0 0 6px">No open ${CH_LABEL[ch].toLowerCase()} orders.</p>`}`; };
  return `<div class="pagehead"><h1>Orders</h1>
    <div class="legend"><span class="badge b-free">Free</span><span class="badge b-open">Taking order</span><span class="badge b-confirmed">Confirmed</span><span class="badge b-billed">Bill ready</span></div>
    <span class="muted">${list.length-busy} free · ${busy} occupied</span></div>
    <div class="newrow"><span class="muted" style="font-weight:700">New order:</span>${['takeaway','zomato','inhouse'].map(ch=>`<button type="button" class="btn small ch-${ch}" data-act="newChannel" data-ch="${ch}">+ ${CH_LABEL[ch]}${ch==='inhouse'?' (no charge)':''}</button>`).join('')}</div>
    <div class="legend" style="margin-bottom:10px"><span class="chtag">Table</span><span class="chtag ch-takeaway">Takeaway</span><span class="chtag ch-zomato">Zomato</span><span class="chtag ch-inhouse">In-house · staff / owner, no charge</span></div>
    <div class="tables">${dineCards}${['takeaway','zomato','inhouse'].map(ch=>chList(ch).map(cardFor).join('')).join('')}</div>`;
}

function itemsFor(t){ return S.draft[t] || (S.orders[t] ? S.orders[t].items : {}) || {}; }

function viewOrder(){
  const t=S.table, o=S.orders[t], st=statusOf(t), draft=S.draft[t];
  const locked = (st==='confirmed'||st==='billed') && !draft;
  const items=itemsFor(t), tt=totals(items);
  const avail=S.menu.filter(m=>m.available!==false);
  const cats=[]; avail.forEach(m=>{ if(m.cat && !cats.includes(m.cat)) cats.push(m.cat); });
  if(!cats.includes(S.cat)) S.cat=cats[0]||'all';
  const sq=(S.q||'').trim().toLowerCase();
  const shown=avail.filter(m=>(S.cat==='all'||m.cat===S.cat));
  const badge = draft ? '<span class="badge b-open">Editing order</span>' :
    st==='confirmed' ? `<span class="badge b-confirmed">Confirmed · ${esc(timeStr(o.confirmedAt))}</span>` :
    st==='billed' ? '<span class="badge b-billed">Bill ready</span>' :
    st==='open' ? '<span class="badge b-open">Taking order</span>' : '<span class="badge b-free">New order</span>';

  const menuHtml = !S.loaded.menu ? '<div class="empty">Loading menu…</div>' :
    !avail.length ? `<div class="empty">The menu is empty.${isOwner()?' Add items in Settings, or <button type="button" class="btn ghost small" data-act="seedMenu">Load BeCafé menu</button>':' Ask the owner to add the menu.'}</div>` :
    `<h3 class="cathead">${esc(S.cat)}</h3><div class="items">${shown.map(m=>{
      const sizes = num(m.priceL)>0 ? [['M',m.price,m.id+'|M'],['L',m.priceL,m.id+'|L']] : [['',m.price,m.id]];
      let any=0;
      const rows = sizes.map(([sz,pr,key])=>{
        const q = items[key] ? num(items[key].qty) : 0; any+=q; const nm=m.name+(sz?' ('+sz+')':'');
        const ctl = q===0
          ? `<button type="button" class="btn ghost small" data-act="qty" data-id="${esc(key)}" data-d="1" ${locked?'disabled':''} aria-label="Add ${esc(nm)}">Add</button>`
          : `<div class="stepper"><button type="button" class="sbtn" data-act="qty" data-id="${esc(key)}" data-d="-1" ${locked?'disabled':''} aria-label="Remove one ${esc(nm)}">−</button><span class="qty num">${q}</span><button type="button" class="sbtn add" data-act="qty" data-id="${esc(key)}" data-d="1" ${locked?'disabled':''} aria-label="Add one ${esc(nm)}">+</button></div>`;
        return `<div class="mfoot">${sz?`<span class="sz">${sz}</span>`:''}<span class="price num">${Number.isInteger(num(pr))?esc(S.settings.currency||'')+num(pr).toLocaleString('en-IN'):money(pr)}</span>${ctl}</div>`;
      }).join('');
      const hide = sq && !(m.name+' '+(m.note||'')+' '+(m.cat||'')).toLowerCase().includes(sq);
      return `<div class="mcard${any?' on':''}${locked?' locked':''}" data-s="${esc((m.name+' '+(m.note||'')+' '+(m.cat||'')).toLowerCase())}" ${hide?'hidden':''}><span class="mname">${esc(m.name)}</span>${m.note?`<span class="mnote">${esc(m.note)}</span>`:''}${rows}</div>`;
    }).join('')}</div>`;

  const conf = (o && o.confirmed) || {};
  const lines = Object.keys(items).map(id=>{
    const it=items[id], was = conf[id] ? num(conf[id].qty) : 0;
    const tag = draft && num(it.qty)!==was ? `<span class="tag">${was===0?'New':'Was ×'+was}</span>` : '';
    return `<div class="line"><div style="min-width:0"><div class="lname"><span>${esc(it.name)}</span>${tag}</div><div class="lsub num">${money(it.price)} each</div></div>
      <div class="stepper"><button type="button" class="sbtn" data-act="qty" data-id="${esc(id)}" data-d="-1" ${locked?'disabled':''} aria-label="Remove one ${esc(it.name)}">−</button><span class="qty num">${num(it.qty)}</span><button type="button" class="sbtn" data-act="qty" data-id="${esc(id)}" data-d="1" ${locked?'disabled':''} aria-label="Add one ${esc(it.name)}">+</button></div>
      <span class="ltot num">${money(num(it.price)*num(it.qty))}</span></div>`;
  }).join('');
  const removed = draft ? Object.keys(conf).filter(id=>!items[id]).map(id=>`<div class="line removed"><div class="lname"><span>${esc(conf[id].name)}</span><span class="tag red">Removed</span></div><span class="lsub">was ×${num(conf[id].qty)}</span><button type="button" class="linkbtn" data-act="restore" data-id="${esc(id)}">Undo</button></div>`).join('') : '';

  let actions='';
  if(draft){
    actions = `<div class="actions"><button type="button" class="btn ghost" data-act="cancelEdit">Cancel</button><button type="button" class="btn primary grow" data-act="saveEdit" ${tt.count?'':'disabled'}>Save changes</button></div>
      ${isOwner()?`<button type="button" class="linkbtn danger" data-act="cancelOrder">${S.arm==='cancel-'+t?'Tap again to cancel the whole order':'Cancel whole order'}</button>`:''}`;
  } else if(st==='confirmed'||st==='billed'){
    actions = S.askInv===t && st==='confirmed' ? trail(o)+`<form class="invform" id="fInv" autocomplete="off"><label for="posInv">🧾 Enter the <b>POS invoice number</b> (6 digits) from the POS machine bill</label>
        <input id="posInv" class="inp num" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="e.g. 004512" value="${esc(S.invDraft||'')}" aria-describedby="invHelp">
        ${S.invErr?`<p class="err" id="invHelp">${esc(S.invErr)}</p>`:'<p class="muted" id="invHelp" style="font-size:13px">The bill is made only after the POS invoice number is entered.</p>'}
        <div class="actions"><button type="button" class="btn ghost grow" data-act="invCancel">Cancel</button><button type="submit" class="btn dark grow">Generate bill</button></div></form>`
      : trail(o)+`<div class="actions"><button type="button" class="btn ghost grow" data-act="startEdit">Edit order</button>${waitingKitchen(o)?`<button type="button" class="btn dark grow" data-act="genBill" aria-disabled="true" style="opacity:.55">Bill after kitchen serves</button>`:`<button type="button" class="btn dark grow" data-act="genBill">${st==='billed'?'View bill':'Generate bill'}</button>`}</div>
      ${waitingKitchen(o)?`<p class="muted" style="font-size:13px;margin:6px 0 0">🍳 Bill unlocks after the kitchen taps <b>Mark as served</b>.</p>`:''}`;
  } else {
    actions = `<div class="actions"><button type="button" class="btn ghost" data-act="clearOrder" ${tt.count?'':'disabled'}>${S.arm==='clear-'+t?'Tap again':'Clear'}</button><button type="button" class="btn primary grow" data-act="confirm" ${tt.count?'':'disabled'}>Confirm order</button></div>`;
  }

  const taker=takerOf(t);
  const takenRow=`<div class="takenrow ${taker?'':'need'}" role="group" aria-label="Who took this order"><span class="cheflbl">📝 Order taken by:</span><div class="cheflist">${(S.settings.staff||[]).map(n=>`<button type="button" class="chefbtn" data-act="takenBy" data-n="${esc(n)}" aria-pressed="${taker===n}">${esc(n)}</button>`).join('')}</div>${taker?'':'<span class="muted" style="font-size:14px">Tap your name before confirming</span>'}</div>`;
  return `<div class="ordhead"><button type="button" class="linkbtn" data-act="nav" data-v="tables">‹ Orders</button><h1>${tLabel(t)}</h1>${badge}${chOf(t)!=='dinein'&&o?`<label for="orderRef" class="sr">Customer name or Zomato order ID</label><input id="orderRef" class="inp" style="max-width:280px" placeholder="${chOf(t)==='zomato'?'Zomato order ID / customer':chOf(t)==='inhouse'?'Who is it for? e.g. Chintu – staff meal':'Customer name / phone'}" value="${esc(o.ref||'')}" autocomplete="off">`:''}</div>
  ${takenRow}
  <div class="oseg" role="group" aria-label="Show menu or order"><button type="button" data-act="oseg" data-s="menu" aria-pressed="${(S.oseg||'menu')==='menu'}">🍽️ Menu<small>add items</small></button><button type="button" class="${tt.count?'has':''}" data-act="oseg" data-s="order" aria-pressed="${S.oseg==='order'}">🧺 Order (${tt.count})<small class="num">${money(tt.total)}</small></button></div>
  <div class="orderwrap seg-${S.oseg==='order'?'order':'menu'}">
    <section class="menu" aria-label="Menu">
      ${cats.length?`<div class="catpick"><div class="cbhead"><span class="cbt">📋 Choose category</span><span class="cbh">swipe ‹ ›</span></div>
        <div class="catrowwrap"><button type="button" class="carr" data-act="catScroll" data-d="-1" aria-label="Scroll categories left">‹</button><div class="catrow">${cats.map(c=>`<button type="button" class="catpill" data-act="catPick" data-c="${esc(c)}" aria-pressed="${S.cat===c}">${esc(c)}</button>`).join('')}</div><button type="button" class="carr" data-act="catScroll" data-d="1" aria-label="Scroll categories right">›</button></div></div>`:''}
      ${locked?'':`<details class="extrabox" ${S.keepExtras?'open':''}><summary>+ Extras from stock (chips, mints, juice…)</summary>
        ${(()=>{ const xs=extraStock(), pr=extraPrices(); if(!xs.length&&!extraItems().length) return ''; const groups={}; xs.forEach(x=>{ const g=EXTRA_CATS.includes(x.cat)?x.cat:'Juices'; (groups[g]=groups[g]||[]).push(x); }); if(extraItems().length) groups['Other extras']=extraItems().map(n=>({name:n}));
          return Object.entries(groups).map(([g,l])=>`<div class="xgroup">${esc(g)}</div><div class="cheflist">${l.map(x=>{ const p=num(pr[x.name]); return `<button type="button" class="xbtn ${p?'':'noprice'}" data-act="pickExtra" data-n="${esc(x.name)}">${esc(x.name)}${p?`<b class="num">₹${p}</b>`:''}</button>`; }).join('')}</div>`).join('')+'<div class="xgroup">Something else</div>'; })()}
        <form id="fExtra"><div class="field" style="flex:2 1 180px"><label for="exName">Item</label><input id="exName" class="inp" maxlength="40" placeholder="e.g. Lays chips" autocomplete="off"></div>
        <div class="field" style="flex:1 1 90px"><label for="exPrice">Price (₹)</label><input id="exPrice" class="inp" type="number" min="0" step="1" inputmode="numeric" placeholder="20"></div>
        <button class="btn primary" type="submit">Add</button></form></details>`}
      ${locked?'<div class="notice">This order is confirmed. Tap “Edit order” to change items or quantities.</div>':''}
      ${menuHtml}
      ${cats.length>1&&!locked?(()=>{ const i=cats.indexOf(S.cat); return `<div class="catnav">${i>0?`<button type="button" class="btn ghost" data-act="catNav" data-d="-1">‹ ${esc(cats[i-1])}</button>`:'<span></span>'}${i<cats.length-1?`<button type="button" class="btn ghost" data-act="catNav" data-d="1">${esc(cats[i+1])} ›</button>`:''}</div>`; })():''}
    </section>
    <aside class="panel ${S.sheet?'open':''}" aria-label="Current order">
      <button type="button" class="phead" data-act="sheet" aria-expanded="${!!S.sheet}"><span class="ptitle"><span class="pt-wide">Current order</span><span class="pt-mob">${S.sheet?'Hide items':'🧺 See items'}</span></span><span class="muted num">${tt.count} item${tt.count===1?'':'s'}</span><span class="ptot num">${money(tt.total)}</span><span class="pchev" aria-hidden="true">▲</span></button>
      <div class="lines">${lines||removed?lines+removed:'<div class="empty">No items yet. Tap “Add” on a menu item.</div>'}</div>
      <div class="sums">
        <div class="sumrow"><span>Subtotal</span><span class="num">${money(tt.sub)}</span></div>
        <div class="sumrow"><span>Tax (${num(S.settings.taxPercent)}%)</span><span class="num">${money(tt.tax)}</span></div>
        <div class="sumrow total"><span>Total</span><span class="num">${money(tt.total)}</span></div>
        ${actions}
      </div>

const PRESETS=[['today','Today'],['yesterday','Yesterday'],['7d','Last 7 days'],['30d','Last 30 days'],['month','This month'],['custom','Custom']];
function addDays(key,n){ const [y,m,d]=key.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dayKey(dt); }
function daysBetween(a,b){ const p=k=>{const [y,m,d]=k.split('-').map(Number); return Date.UTC(y,m-1,d);}; return Math.round((p(b)-p(a))/864e5); }
function computeRange(){
  const r=S.range, today=dayKey(); let from,to;
  if(r.preset==='today'){ from=to=today; }
  else if(r.preset==='yesterday'){ from=to=addDays(today,-1); }
  else if(r.preset==='7d'){ to=today; from=addDays(today,-6); }
  else if(r.preset==='30d'){ to=today; from=addDays(today,-29); }
  else if(r.preset==='month'){ to=today; from=today.slice(0,8)+'01'; }
  else { from=r.from||today; to=r.to||today; if(from>to){ const x=from; from=to; to=x; } }
  const len=daysBetween(from,to)+1;
  return {from,to,len,prevTo:addDays(from,-1),prevFrom:addDays(from,-len)};
}
function fmtDay(key,withWeekday){ const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString([], withWeekday?{weekday:'short',day:'numeric',month:'short'}:{day:'numeric',month:'short'}); }
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const f=v/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function shortMoney(n){ const c=esc(S.settings.currency||''); n=num(n); if(n>=10000000) return c+(n/10000000).toFixed(1).replace(/\.0$/,'')+'Cr'; if(n>=100000) return c+(n/100000).toFixed(1).replace(/\.0$/,'')+'L'; if(n>=1000) return c+(n/1000).toFixed(1).replace(/\.0$/,'')+'k'; return c+Math.round(n); }
function catOf(i){ if(i.cat) return i.cat; const m=S.menu.find(x=>x.name===i.name); return (m&&m.cat)||'Other'; }

/* vertical bar chart: data=[{label,value,tip,hi}] */
function barChart(data, opts){
  const W=720,H=230,L=52,R=8,T=12,B=30, n=data.length||1;
  const max=niceMax(Math.max(0,...data.map(d=>d.value)));
  const iw=W-L-R, ih=H-T-B, slot=iw/n, bw=Math.max(2,Math.min(44,slot-Math.max(2,slot*0.28)));
  const y=v=>T+ih-(v/max)*ih;
  let g='';
  for(let i=0;i<=4;i++){ const v=max*i/4, yy=y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" class="grid"/><text x="${L-8}" y="${yy+4}" text-anchor="end" class="axis">${opts.money?shortMoney(v):Math.round(v)}</text>`; }
  const every=Math.ceil(n/(opts.maxLabels||12));
  data.forEach((d,i)=>{
    const x=L+i*slot+(slot-bw)/2, h=Math.max(0,ih*(d.value/max)), top=T+ih-h, r=Math.min(4,bw/2,h);
    if(h>0) g+=`<path d="M${x},${T+ih} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${T+ih} Z" class="bar${d.hi?' hi':''}"/>`;
    g+=`<rect x="${L+i*slot}" y="${T}" width="${slot}" height="${ih}" fill="transparent" data-tip="${esc(d.tip)}"/>`;
    if(i%every===0) g+=`<text x="${L+i*slot+slot/2}" y="${H-10}" text-anchor="middle" class="axis">${esc(d.label)}</text>`;
  });
  g+=`<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" class="base"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(opts.aria)}">${g}</svg>`;
}
/* horizontal bars as HTML rows */
function hbars(rows, valueText){
  const max=Math.max(1,...rows.map(r=>r.value));
  return `<div class="hbars">${rows.map(r=>`<div class="hrow" data-tip="${esc(r.tip)}"><span class="hname">${esc(r.name)}</span><span class="htrack"><span class="hfill" style="width:${Math.max(1.5,r.value/max*100)}%"></span></span><span class="hval num">${valueText(r)}</span></div>`).join('')}</div>`;
}
function delta(cur,prev,lbl){
  if(!prev) return cur?'<span class="delta muted">no earlier data</span>':'';
  const p=(cur-prev)/prev*100; const up=p>=0;
  return `<span class="delta ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(p).toFixed(0)}% <span class="muted">${lbl}</span></span>`;
}

  const sum=(arr,f)=>arr.reduce((a,b)=>a+f(b),0);

    const w=b.waiter||'—'; staff[w]=staff[w]||{name:w,bills:0,amt:0}; staff[w].bills++; staff[w].amt+=num(b.total); });
  const top=Object.values(per).sort((a,b)=>b.qty-a.qty||b.amt-a.amt);

  const least=top.length>3?top.slice(-3).reverse():[];
  const bills=cur.slice().sort((a,b)=>num(b.paidAt)-num(a.paidAt));
  const label=R.from===R.to?fmtDay(R.from,true):`${fmtDay(R.from,false)} – ${fmtDay(R.to,false)}`;

  const controls=`<div class="rangebar" role="group" aria-label="Date range">${PRESETS.map(([k,l])=>`<button type="button" class="pill" data-act="range" data-p="${k}" aria-pressed="${S.range.preset===k}">${l}</button>`).join('')}
    ${S.range.preset==='custom'?`<span class="row" style="align-items:center"><label for="rFrom" class="muted">From</label><input id="rFrom" class="inp" type="date" value="${esc(R.from)}" max="${dayKey()}" style="width:auto"><label for="rTo" class="muted">To</label><input id="rTo" class="inp" type="date" value="${esc(R.to)}" max="${dayKey()}" style="width:auto"></span>`:''}</div>`;

  let body;
  if(!S.loaded.bills) body='<div class="empty">Loading sales…</div>';
  else if(!cur.length) body=`<div class="empty">No paid bills for ${esc(label)}. Bills appear here when a barista taps “Mark as paid”.</div>`;
  else body=`
    <div class="stats">
      <div class="stat"><div class="k">Total sales</div><div class="v num">${money(sales)}</div>${delta(sales,psales,cmp)}</div>
      <div class="stat"><div class="k">Bills</div><div class="v num">${cur.length}</div>${delta(cur.length,prev.length,cmp)}</div>
      <div class="stat"><div class="k">Average bill</div><div class="v num">${money(avg)}</div>${delta(avg,pavg,cmp)}</div>
      <div class="stat"><div class="k">Items sold</div><div class="v num">${items}</div>${delta(items,pitems,cmp)}</div>
    </div>
    ${inh.length?(()=>{ const it={}; inh.forEach(b=>(b.items||[]).forEach(i=>{ it[i.name]=(it[i.name]||0)+num(i.qty); })); return `<div class="inhouse-note"><span class="freetag">In-house · not in sales</span> <b>${inh.length}</b> staff/owner order${inh.length===1?'':'s'} · value <b class="num">${money(sum(inh,b=>num(b.value)))}</b><br>${Object.entries(it).sort((a,b)=>b[1]-a[1]).map(([n,q])=>`${q}× ${esc(n)}`).join(', ')}</div>`; })():''}
    <p class="insight">Busiest hour: <b>${(busiest%12||12)}–${((busiest+1)%12||12)} ${busiest+1<12||busiest+1===24?'AM':'PM'}</b> · Best seller: <b>${esc(top[0].name)}</b> (${top[0].qty} sold) · Tax collected: <b class="num">${money(tax)}</b></p>
    <section class="card"><h2 class="sec">${trendTitle}</h2>${trend}</section>
    <div class="agrid">
      <section class="card"><h2 class="sec">Top items</h2>${hbars(top.slice(0,10).map(r=>({name:r.name,value:r.qty,tip:`${r.name}: ${r.qty} sold · ${money(r.amt)}`})),r=>r.value)}
        ${least.length?`<p class="muted" style="font-size:14px;margin-top:10px">Slowest: ${least.map(r=>`${esc(r.name)} (${r.qty})`).join(', ')}</p>`:''}</section>
      <section class="card"><h2 class="sec">Sales by channel</h2>${hbars(['dinein','takeaway','zomato'].map(c=>{ const bs=cur.filter(b=>billCh(b)===c); const a=sum(bs,b=>num(b.total)); return {name:CH_LABEL[c],value:a,n:bs.length,tip:`${CH_LABEL[c]}: ${money(a)} · ${bs.length} bills`}; }),r=>shortMoney(r.value)+` <span class="muted">${r.n} bills</span>`)}</section>
      <section class="card"><h2 class="sec">Sales by category</h2>${hbars(catRows.map(r=>({name:r.name,value:r.amt,tip:`${r.name}: ${money(r.amt)} · ${r.qty} items · ${(r.amt/sales*100).toFixed(0)}% of sales`})),r=>shortMoney(r.value)+` <span class="muted">${(r.value/sales*100).toFixed(0)}%</span>`)}</section>
      <section class="card"><h2 class="sec">By barista</h2><div class="tablebox"><table><thead><tr><th>Barista</th><th class="r">Bills</th><th class="r">Sales</th><th class="r">Avg bill</th></tr></thead><tbody>
        ${staffRows.map(r=>`<tr><td>${esc(r.name)}</td><td class="r num">${r.bills}</td><td class="r num">${money(r.amt)}</td><td class="r num">${money(r.amt/r.bills)}</td></tr>`).join('')}</tbody></table></div></section>
    </div>
    <div class="salesgrid" style="margin-top:20px">
      <section class="itemwise"><h2 class="sec">Item-wise sales</h2><div class="tablebox"><table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Amount</th></tr></thead><tbody>
        ${top.map(r=>`<tr><td>${esc(r.name)}</td><td class="r num"><b>${r.qty}</b></td><td class="r num">${money(r.amt)}</td></tr>`).join('')}
      </tbody></table></div></section>
      <section class="billlist"><h2 class="sec">Paid bills <span class="muted" style="font-size:14px">(${bills.length})</span></h2><div class="tablebox"><table><thead><tr><th>When</th><th>Bill</th><th>Items ordered</th><th>Barista</th><th class="r">Total</th></tr></thead><tbody>
        ${bills.slice(0,S.allBills?500:15).map(b=>`<tr><td class="num">${R.len>1?esc(fmtDay(b.day,false))+'<br>':''}${esc(timeStr(b.paidAt))}</td><td class="num">${esc(tLabel(b.table))}<div class="det">${esc(b.billNo)}${b.ref?' · '+esc(b.ref):''}</div></td><td>${(b.items||[]).map(i=>`${num(i.qty)}× ${esc(i.name)}`).join('<br>')}</td><td>${esc(b.waiter)}</td><td class="r num"><b>${money(b.total)}</b></td></tr>`).join('')}
      </tbody></table></div>${bills.length>15?`<button type="button" class="btn ghost small" style="margin-top:10px" data-act="allBills">${S.allBills?'Show fewer':'Show all '+Math.min(bills.length,500)+' bills'}</button>`:''}</section>
    </div>`;
  return `<div class="pagehead"><h1>Sales analytics</h1><span class="muted">${esc(label)}</span></div>${controls}${body}`;
}

/* ---------- actions ---------- */
function orderRef(t){ return S.db.doc('orders/table-'+t); }
async function putOrder(t,data){ S.orders[t]=data; render(); if(!S.db) return; try{ await orderRef(t).set(data); }catch(e){ fail(e); } }
async function dropOrder(t){ delete S.orders[t]; render(); if(!S.db) return; try{ await orderRef(t).delete(); }catch(e){ fail(e); } }
async function saveSettings(patch){
  S.settings={...S.settings,...patch}; render(true);
  if(!S.db) return;
  try{ await S.db.doc('config/settings').set(clone(S.settings)); }catch(e){ fail(e); }
}

const EXTRA_CATS=['Retail Snacks','Mints & Gum'], EXTRA_NAMES=['malas cranberry juice','tender coconut water'];
function extraStock(){ return (S.stock||[]).filter(x=>EXTRA_CATS.includes(x.cat)||EXTRA_NAMES.includes(String(x.name).toLowerCase())); }
function extraItems(){ return Array.isArray(S.settings&&S.settings.extraItems)?S.settings.extraItems:[]; }
function extraPrices(){ let m={}; try{ m=JSON.parse(lsGet('becafe.xp')||'{}')||{}; }catch(e){} return {...m,...((S.settings&&S.settings.extraPrices)||{})}; }
function rememberPrice(n,pr){ let m={}; try{ m=JSON.parse(lsGet('becafe.xp')||'{}')||{}; }catch(e){} m[n]=pr; lsSet('becafe.xp',JSON.stringify(m)); if(isOwner()) saveSettings({extraPrices:{...((S.settings&&S.settings.extraPrices)||{}),[n]:pr}}); }
function addExtra(n,pr){ const id='x-'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,30)+'-'+pr; changeQty(id,1,{name:n,price:pr,cat:'Extras'}); toast('Added '+n+' · ₹'+pr); }
function changeQty(id,d,seed){
  const t=S.table, o=S.orders[t], st=statusOf(t), [mid,sz]=String(id).split('|'), m=S.menu.find(x=>x.id===mid);
  const mPrice = m ? num(sz==='L'?m.priceL:m.price) : 0, mName = m ? m.name+(sz?' ('+sz+')':'') : '';
  const apply=(items)=>{ const cur=items[id]; const q=(cur?num(cur.qty):0)+d;
    if(q<=0) delete items[id]; else if(!cur&&!m&&seed) items[id]={...seed,qty:q}; else if(cur||m) items[id]={name:cur?cur.name:mName, price:cur?num(cur.price):mPrice, cat:(cur&&cur.cat)||(m&&m.cat)||'', qty:q}; };
  if(S.draft[t]){ apply(S.draft[t]); render(); return; }
  if(st==='confirmed'||st==='billed') return;
  const items=clone(o?o.items:{}); apply(items);
  if(!Object.keys(items).length){ dropOrder(t); return; }
  putOrder(t,{table:t,channel:chOf(t),ref:(o&&o.ref)||'',status:'open',items,waiter:takerOf(t)||(o&&o.waiter)||S.barista,createdAt:(o&&o.createdAt)||Date.now(),updatedAt:Date.now()});
}
function billNo(t){ const d=new Date(); return String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+'-'+(t>=300?'H'+(t-300):t>=200?'Z'+(t-200):t>=100?'P'+(t-100):'T'+t); }

async function markPaid(t){
  const o=S.orders[t]; if(!o) return;
  const tt=totals(o.items), now=Date.now();
  const entry={billNo:o.billNo||billNo(t), posInvoice:o.posInvoice||null, day:dayKey(new Date(now)), table:t, channel:chOf(t), ref:o.ref||'', waiter:o.waiter||S.barista, chef:andList(chefsOf(o)), chefs:chefsOf(o), createdAt:o.createdAt||null, confirmedAt:o.confirmedAt||null, servedAt:o.servedAt||null, billedAt:o.billedAt||null, paidAt:now, paidBy:S.barista,
    items:Object.values(clone(o.items)), sub:tt.sub, tax:tt.tax, total:tt.total, paidAt:now};
  if(chOf(t)==='inhouse'){ entry.inhouse=true; entry.value=tt.total; entry.sub=0; entry.tax=0; entry.total=0; }
  if(S.db){ try{ await S.db.collection('bills').add(entry); }catch(e){ fail(e); return; } }
  S.view='tables'; S.table=null; S.arm='';
  await dropOrder(t);
  toast(chOf(t)==='inhouse'?tLabel(t)+' saved as in-house (no charge)':tLabel(t)+' paid · '+(S.settings.currency||'')+tt.total.toFixed(2));
}

const ACT = {
  nav(el){ S.view=el.dataset.v; S.arm=''; S.keepExtras=false; render(true); window.scrollTo(0,0); },
  pickBarista(el){ S.barista=el.dataset.name; lsSet('becafe.barista',S.barista); S.view='tables'; render(true); },
  sheet(){ S.sheet=!S.sheet; render(true); },
  oseg(el){ S.oseg=el.dataset.s; render(true); window.scrollTo(0,0); },
  catPick(el){ S.cat=el.dataset.c; render(true); },
  catScroll(el){ const r=document.querySelector('.catrow'); if(r) r.scrollBy({left:Number(el.dataset.d)*Math.max(160,r.clientWidth*0.7),behavior:'smooth'}); },
  catNav(el){ const t=S.table, cats=[]; S.menu.filter(m=>m.available!==false).forEach(m=>{ if(m.cat&&!cats.includes(m.cat)) cats.push(m.cat); }); const i=cats.indexOf(S.cat)+Number(el.dataset.d); if(i>=0&&i<cats.length){ S.cat=cats[i]; render(true); const c=[...document.querySelectorAll('.oseg,.catpick')].find(x=>x.offsetParent); if(c) c.scrollIntoView({block:'start'}); } },
  invCancel(){ S.askInv=null; S.invErr=''; S.invDraft=''; render(true); },
  openTable(el){ const t=Number(el.dataset.t); S.table=t; S.sheet=false; S.oseg=(statusOf(t)==='confirmed'||statusOf(t)==='billed')?'order':'menu'; S.askInv=null; S.invErr=''; S.cat='all'; S.q=''; S.arm=''; S.view = statusOf(t)==='billed' && !S.draft[t] ? 'bill' : 'order'; render(true); window.scrollTo(0,0); },
  cat(el){ S.cat=el.dataset.c; S.secOpen=false; render(true); const m=document.querySelector('.menu'); if(m) m.scrollTop=0; },
  secToggle(){ S.secOpen=!S.secOpen; render(true); },
  qty(el){ changeQty(el.dataset.id, Number(el.dataset.d)); },
  restore(el){ const t=S.table, c=S.orders[t].confirmed[el.dataset.id]; if(S.draft[t]&&c){ S.draft[t][el.dataset.id]=clone(c); render(); } },
  clearOrder(){ const t=S.table; if(S.arm!=='clear-'+t){ S.arm='clear-'+t; render(true); return; } S.arm=''; dropOrder(t); },
  takenBy(el){ const t=S.table, n=el.dataset.n; S.takenBy=S.takenBy||{}; S.takenBy[t]=n; const o=S.orders[t]; if(o) putOrder(t,{...clone(o),waiter:n}); else render(true); toast('Order taken by '+n); },
  pickExtra(el){ const n=el.dataset.n, pr=num(extraPrices()[n]); S.keepExtras=true;
    if(pr>0){ addExtra(n,pr); return; }
    const i=document.getElementById('exName'), p=document.getElementById('exPrice'); if(i) i.value=n; if(p){ p.value=''; p.focus(); }
    toast('Enter the price of '+n+' once. It will be remembered.'); },
  confirm(){ const t=S.table, o=S.orders[t]; if(!o||!totals(o.items).count) return; if(takerOf(t)) S.oseg='order';
    if(!takerOf(t)){ toast('Tap your name under “Order taken by” first'); const r=document.querySelector('.takenrow'); if(r){ r.scrollIntoView({block:'center',behavior:'smooth'}); r.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300}); } return; }
    putOrder(t,{...clone(o),status:'confirmed',confirmed:clone(o.items),confirmedAt:Date.now(),updatedAt:Date.now(),rev:1,served:false,waiter:o.waiter||S.barista});
    toast('Order confirmed for '+tLabel(t)); },

/* ---------- data ---------- */
function sortMenu(list){
  const firstSort={}; list.forEach(m=>{ const s=num(m.sort); if(!(m.cat in firstSort) || s<firstSort[m.cat]) firstSort[m.cat]=s; });
  return list.sort((a,b)=> (firstSort[a.cat]-firstSort[b.cat]) || String(a.cat).localeCompare(String(b.cat)) || num(a.sort)-num(b.sort) || String(a.name).localeCompare(String(b.name)));
}
function parseConfig(text){
  if(!text) return null;
  const out={};
  ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'].forEach(k=>{
    const m=text.match(new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']')); if(m) out[k]=m[1];
  });
  return out.apiKey && out.authDomain && out.projectId ? out : null;
}

const OWNER_EMAILS=['fatemaakhtarcs@gmail.com'];
async function detectRole(db, email){
  const key='becafe.role.'+email;
  try{ await db.collection('stocklog').limit(1).get({source:'server'}); lsSet(key,'owner'); return 'owner'; }
  catch(e){ if(e && e.code==='permission-denied'){ lsSet(key,'barista'); return 'barista'; } return lsGet(key)||'barista'; }
}

let started=false;
function start(){
  let cfg=EMBEDDED_CONFIG;
  if(!cfg){ try{ cfg=JSON.parse(lsGet('becafe.config')||'null'); }catch(e){ cfg=null; } }
  if(typeof firebase==='undefined'){ $main.innerHTML='<div class="banner">The app couldn’t load. Connect to the internet and reload the page.</div>'; return; }
  if(!cfg){ S.phase='setup'; render(true); return; }
  try{ firebase.initializeApp(cfg); }catch(e){ S.phase='setup'; S.setupErr='That config didn’t work. Paste it again.'; lsSet('becafe.config',null); render(true); return; }
  try{ firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){ S.phase='login'; render(true); if(started) location.reload(); return; }
    S.email=u.email||'';
    const db=firebase.firestore();
    const probe=await detectRole(db, S.email);
    const listed=OWNER_EMAILS.includes(String(S.email).trim().toLowerCase());
    S.role=(listed||probe==='owner')?'owner':'barista';
    S.rulesWarn = listed && probe!=='owner';
    if(S.role==='owner' && S.barista && S.barista!=='Owner' && !(S.settings.staff||[]).includes(S.barista)) S.barista='';
    if(S.role==='owner' && ['order','bill'].includes(S.view)) S.view='tables';
    if(isOwner()){ S.barista='Owner'; } else { S.barista='Barista'; lsSet('becafe.barista',null); }
    S.phase='app';
    if(!started){ started=true; connect(db); }
    render(true);
  });
  window.addEventListener('online',()=>{ S.offline=false; render(); });
  window.addEventListener('offline',()=>{ S.offline=true; render(); });
}

function connect(db){
  S.db=db;
  const onErr=()=>{ S.offline=true; render(); };
  db.doc('config/settings').onSnapshot(s=>{ S.settings={...DEFAULTS,...(s.exists?s.data():{})}; if(!Array.isArray(S.settings.staff)||!S.settings.staff.length) S.settings.staff=DEFAULTS.staff.slice(); if(num(S.settings.dataVersion)<2){ const st=S.settings.staff.slice(); DEFAULTS.staff.forEach(n=>{ if(!st.includes(n)) st.push(n); }); S.settings.staff=st; } if(!S.settings.currency||S.settings.currency==='$'||/^\$|usd/i.test(S.settings.currency)) S.settings.currency='₹'; S.loaded.settings=true; render(); maybeSync(); maybeAddCombo(); }, onErr);
  db.collection('menu').onSnapshot(q=>{ S.menu=sortMenu(q.docs.map(d=>{ const x={...d.data()}; x.id=d.id; return x; })); S.loaded.menu=true; render(); maybeSync(); maybeAddCombo(); }, onErr);
  db.collection('orders').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ const x=d.data(); if(x&&x.table!=null) o[x.table]=x; }); S.orders=o; S.loaded.orders=true; render(); }, onErr);
  watchBills();
  watchDayBills();
  connectExtras(db);
}
/* ---------- attendance ---------- */
function monthKey(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function slug(n){ return String(n).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x'; }
function dur(ms){ const t=Math.round(Math.max(0,ms)/6e4), h=Math.floor(t/60), m=t%60; return h+'h '+pad(m)+'m'; }
function attNames(recs){ const n=(S.settings.staff||[]).slice(); recs.forEach(r=>{ if(r.name&&!n.includes(r.name)) n.push(r.name); }); return n; }
function viewAttendance(){
  const today=dayKey(), names=attNames(S.attToday);

      else if(r.in && !r.out) btn=`<button type="button" class="btn dark" data-act="clockOut" data-n="${esc(n)}">${S.arm==='out-'+n?'Tap again to clock out':'Clock out'}</button>`;

  }
  const cards=names.map(n=>{

    else if(r.in && !r.out){ st=`<span class="badge b-confirmed">In since ${esc(timeStr(r.in))}</span>`; btn=`<button type="button" class="btn dark small" data-act="clockOut" data-n="${esc(n)}">${S.arm==='out-'+n?'Tap again to clock out':'Clock out'}</button>`; }

}
function viewAttMonth(){
  const mk=S.attMonthKey, [y,m]=mk.split('-').map(Number), nd=new Date(y,m,0).getDate(), today=dayKey();

/* match what was bought to a stock item, ignoring the company/brand name */
const SYN={chocolate:'cocoa',choco:'cocoa',chocolates:'cocoa',coco:'cocoa',ketchup:'sauce',sos:'sauce',souce:'sauce',sause:'sauce',momo:'momos',momoz:'momos',rolls:'roll',springroll:'spring roll',cups:'cup',glass:'cup',bottle:'',bottles:'',packet:'',packets:'',pkt:'',pack:'',box:'',boxes:'',pcs:'',pc:'',kg:'',gm:'',g:'',ml:'',ltr:'',l:'',of:'',and:'',the:'',with:'',new:''};
function normToks(t){ return String(t||'').toLowerCase().replace(/&/g,' ').replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(Boolean)
  .flatMap(w=>{ let x=w in SYN?SYN[w]:w; if(!x) return []; return x.split(' '); }).map(w=>w.length>4&&w.endsWith('es')&&!w.endsWith('ses')?w.slice(0,-2):w.length>3&&w.endsWith('s')&&w!=='momos'?w.slice(0,-1):w).filter(w=>w&&!/^\d+$/.test(w)); }
function matchStock(text){
  const qt=[...new Set(normToks(text))]; if(!qt.length) return null;
  const exact=findStock(text); if(exact) return exact;
  const items=S.stock.map(i=>({i,t:new Set(normToks(i.name))})); const df={}; items.forEach(x=>x.t.forEach(w=>df[w]=(df[w]||0)+1));
  const N=items.length||1; let best=null, bs=0, second=0;
  const idf=w=>Math.log(1+N/(df[w]||1));
  items.forEach(x=>{ let sc=0, hits=0, got=0; const tot=[...x.t].reduce((a,w)=>a+idf(w),0)||1;
    qt.forEach(w=>{ if(x.t.has(w)){ sc+=idf(w); got+=idf(w); hits++; } else { for(const v of x.t){ if(v.length>=4&&w.length>=4&&(v.startsWith(w)||w.startsWith(v))){ sc+=0.6*idf(v); got+=0.6*idf(v); hits++; break; } } } });
    if(!hits) return; const cover=got/tot; if(!(cover>=0.5||(hits>=2&&cover>=0.34))) return;
    sc=sc*(0.4+0.6*cover);
    if(sc>bs){ second=bs; bs=sc; best=x.i; } else if(sc>second) second=sc; });
  return bs>0 ? best : null; }

async function shrinkPhoto(file){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    let max=1280, q=0.6, out='';
    for(let k=0;k<4;k++){ const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); out=c.toDataURL('image/jpeg',q); if(out.length<700000) break; max=Math.round(max*0.8); q=Math.max(0.35,q-0.1); }
    return out; } finally { URL.revokeObjectURL(url); }
}
